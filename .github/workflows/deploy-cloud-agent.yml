name: Deploy Cloud Agent

on:
  push:
    branches:
      - main
    paths:
      - 'workers/cloud-agent/**'
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          cd workers/cloud-agent
          npm install
          
      - name: Run Vitest Cloudflare Worker Tests
        run: |
          cd workers/cloud-agent
          npm run test
          
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "26b9a1161cddac39ae8970865a56747c"
          workingDirectory: 'workers/cloud-agent'
