name: PR / Dummy Pipeline

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache APT Packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb
          version: 1.0

      - name: Run Tests with Logging
        run: |
          mkdir -p logs
          xvfb-run -a python3 tests/run_all_tests.py > logs/test-output.log 2>&1 || (cat logs/test-output.log && exit 1)
          cat logs/test-output.log

      - name: Upload Test Logs
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/test-output.log

      - name: Dry-run Snap Build (AMD64)
        uses: snapcore/action-build@v1
        id: build

      - name: Upload Snap Artifact (Dry-Run)
        uses: actions/upload-artifact@v4
        with:
          name: aswitchi-snap-amd64
          path: ${{ steps.build.outputs.snap }}
