name: Industry Main CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  release:
    types: [published]

jobs:
  test-and-deploy-website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache APT Packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb
          version: 1.0

      - name: Install Desktop Shortcuts
        run: bash scripts/install-desktop.sh

      - name: Run Tests with Logging
        run: |
          mkdir -p logs
          xvfb-run -a python3 tests/run_all_tests.py > logs/test-output.log 2>&1 || (cat logs/test-output.log && exit 1)
          cat logs/test-output.log

      - name: Upload Test Logs
        uses: actions/upload-artifact@v4
        with:
          name: main-test-logs
          path: logs/test-output.log

      - name: Run SEO Specialist Agent
        run: python3 scripts/seo_agent.py

      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-and-publish-snap:
    needs: test-and-deploy-website
    strategy:
      matrix:
        # Building for amd64 and arm64. GitHub provides ubuntu-24.04-arm for open-source repos!
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    continue-on-error: true # ARM runner might not be enabled for this specific repo, so we allow failure
    steps:
      - uses: actions/checkout@v4

      - name: Build Snap Package
        uses: snapcore/action-build@v1
        id: build

      - name: Upload Snap Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aswitchi-snap-${{ matrix.os }}
          path: ${{ steps.build.outputs.snap }}


      - name: Generate CI/CD Summary
        if: always()
        run: |
          echo "## 🚀 AswitchI CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Snap Store Build Status" >> $GITHUB_STEP_SUMMARY
          echo "- Architecture: \`${{ matrix.os }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 SEO & Frontend Agent" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Validated Glassmorphism UI" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Generated \`sitemap.xml\` & \`robots.txt\`" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Deployed to GitHub Pages (aswitchi.lorapok.tech)" >> $GITHUB_STEP_SUMMARY

      - name: Publish Snap to Store
        if: github.event_name == 'release' || github.ref == 'refs/heads/main'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          store_login: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          snap: ${{ steps.build.outputs.snap }}
          release: stable
