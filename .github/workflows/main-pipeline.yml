name: AswitchI Full Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # JOB 1: Test, SEO Optimization & GitHub Pages Deployment
  # ==========================================================
  test-and-deploy:
    name: 🧪 Test, SEO & Website Deployment
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚡ Cache System & APT Dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb
          version: 1.0

      - name: 🛠️ Set up Desktop Shortcuts & Permissions
        run: |
          chmod +x bin/aswitchi aswitchi_native.py scripts/*.sh scripts/*.py
          bash scripts/install-desktop.sh

      - name: 🧪 Execute Test Suite with Xvfb
        run: |
          mkdir -p logs
          xvfb-run -a python3 tests/run_all_tests.py > logs/test-output.log 2>&1 || (cat logs/test-output.log && exit 1)
          cat logs/test-output.log

      - name: 📤 Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aswitchi-test-logs
          path: logs/test-output.log
          retention-days: 14

      - name: 🤖 Execute SEO Specialist Agent
        run: |
          python3 scripts/seo_agent.py

      - name: 🌐 Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v4

      - name: 📦 Upload Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website'

      - name: 🚀 Deploy to GitHub Pages (aswitchi.lorapok.tech)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4

  # ==========================================================
  # JOB 2: Multi-Architecture Snap Build & Store Release
  # ==========================================================
  build-and-package-snap:
    name: 📦 Build Linux Package (${{ matrix.os }})
    needs: test-and-deploy
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🔧 Ensure Executable Permissions
        run: |
          chmod -R +rx bin/
          chmod +x aswitchi_native.py

      - name: 📦 Build Snap Package
        uses: snapcore/action-build@v1
        id: build

      - name: 📤 Upload Snap Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aswitchi-${{ matrix.arch }}-snap
          path: ${{ steps.build.outputs.snap }}
          retention-days: 30

      - name: 🚀 Publish Snap to Ubuntu Store
        if: (github.event_name == 'release' || github.ref == 'refs/heads/main') && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          store_login: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          snap: ${{ steps.build.outputs.snap }}
          release: stable

      - name: 📊 Generate CI/CD Step Summary Dashboard
        if: always()
        run: |
          echo "## 🚀 AswitchI CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Architecture** | \`${{ matrix.arch }}\` (${{ matrix.os }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Snap Package Build** | ✅ Built Successfully |" >> $GITHUB_STEP_SUMMARY
          echo "| **Website & SEO** | ✅ Deployed to [aswitchi.lorapok.tech](https://aswitchi.lorapok.tech/) |" >> $GITHUB_STEP_SUMMARY
          if [ -z "${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}" ]; then
            echo "| **Snap Store Publishing** | ℹ️ Binary built & saved as artifact. (To publish live to Snap Store, add \`SNAPCRAFT_STORE_CREDENTIALS\` secret). |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Snap Store Publishing** | 🚀 Published to Canonical Snap Store |" >> $GITHUB_STEP_SUMMARY
          fi
