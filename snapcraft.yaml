name: aswitchi
version: git
summary: Native Ubuntu Launchpad & AI Switcher
description: |
  **AswitchI** by Lorapok Labs brings the fluid, intuitive experience of the macOS Launchpad and 3D Dock directly to Ubuntu, engineered exclusively for AI developer productivity.

  It serves as a unified, central dashboard that automatically scans, organizes, and launches your entire AI engineering stack with zero friction:

  * **Desktop AI IDEs:** One-click access to specialized environments like Cursor and Windsurf.
  * **CLI AI Agents:** Instantly deploy terminal-based agents like Cline, Aider, and Antigravity.
  * **Persistent Web AIs:** Run ChatGPT, Claude, and Gemini in isolated, persistent web sessions without needing multiple browser tabs.

  Powered by a lightweight _WebKit2GTK_ architecture, AswitchI guarantees blazing-fast hardware acceleration, seamless context switching, and deep native Linux desktop integration. 

  Discover a cleaner way to build with AI.
  Learn more: https://aswitchi.lorapok.tech
grade: stable
confinement: classic
base: core22
parts:
  aswitchi:
    plugin: dump
    source: .
    stage-packages:
    - python3
    - python3-gi
    - gir1.2-gtk-3.0
    - gir1.2-webkit2-4.1
    - libwebkit2gtk-4.1-0
    - libgtk-3-0
    override-build: 'snapcraftctl build

      mkdir -p $SNAPCRAFT_PART_INSTALL/opt/aswitchi

      cp -r src assets docs bin aswitchi_native.py $SNAPCRAFT_PART_INSTALL/opt/aswitchi/

      '
apps:
  aswitchi:
    command: opt/aswitchi/bin/aswitchi
    environment:
      PYTHONPATH: $SNAP/opt/aswitchi
      GI_TYPELIB_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET/girepository-1.0:$SNAP/usr/lib/girepository-1.0
title: AswitchI
icon: assets/icon.png
license: GPL-3.0-or-later
contact: lorapokdev@gmail.com
issues: https://github.com/Maijied/AswitchI/issues
website: https://aswitchi.lorapok.tech
source-code: https://github.com/Maijied/AswitchI
donation: https://github.com/sponsors/Maijied
