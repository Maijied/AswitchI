name: aswitchi
version: '1.0'
summary: Native Ubuntu Launchpad & AI Switcher
description: 'AswitchI by Lorapok Labs perfectly emulates the macOS Launchpad and
  Dock experience on Ubuntu, specialized entirely for AI productivity.


  It functions as a unified, fluid dashboard for scanning, organizing, and launching
  Desktop AI IDEs (Cursor, Windsurf), CLI AI Agents (Cline, Aider), and Web AIs (ChatGPT,
  Claude) seamlessly.


  Powered by WebKit2GTK for blazing-fast hardware acceleration and native desktop
  integration.'
grade: stable
confinement: classic
base: core22
parts:
  aswitchi:
    plugin: dump
    source: .
    stage-packages:
    - python3
    - python3-gi
    - gir1.2-gtk-3.0
    - gir1.2-webkit2-4.1
    - libwebkit2gtk-4.1-0
    - libgtk-3-0
    override-build: 'snapcraftctl build

      mkdir -p $SNAPCRAFT_PART_INSTALL/opt/aswitchi

      cp -r src assets docs bin aswitchi_native.py $SNAPCRAFT_PART_INSTALL/opt/aswitchi/

      '
apps:
  aswitchi:
    command: opt/aswitchi/bin/aswitchi
    environment:
      PYTHONPATH: $SNAP/opt/aswitchi
      GI_TYPELIB_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET/girepository-1.0:$SNAP/usr/lib/girepository-1.0
title: AswitchI
icon: assets/snap_icon.jpg
license: GPL-3.0-or-later
contact: maizied@lorapok.tech
issues: https://github.com/Maijied/AswitchI/issues
website: https://aswitchi.lorapok.tech
source-code: https://github.com/Maijied/AswitchI
